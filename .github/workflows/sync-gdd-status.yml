name: Sync GDD Status

on:
  push:
    paths:
      - tools/gdd_status.json
      - tools/update_gdd_status.py

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update GDD checklist
        run: python tools/update_gdd_status.py

      - name: Commit synchronized GDD
        run: |
          if git diff --quiet -- docs/GDD.md; then
            echo "GDD already synchronized"
            exit 0
          fi
          git config user.name "riftworks-gdd-bot"
          git config user.email "riftworks-gdd-bot@users.noreply.github.com"
          git add docs/GDD.md
          git commit -m "Sync living GDD implementation checklist"
          git push
