name: Godot Smoke Test

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Godot 4.6.3
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.6.3
          use-dotnet: false

      - name: Import project
        run: godot --headless --path . --editor --quit

      - name: Strict compile every GDScript
        run: godot --headless --path . --script res://tools/strict_compile.gd

      - name: Boot main scene
        run: godot --headless --rendering-method gl_compatibility --path . --quit-after 3
